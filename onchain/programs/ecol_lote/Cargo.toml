[package]
name = "ecol_lote"
version = "0.1.0"
description = "EcolChain — registro e máquina de estados do lote de reciclado"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "ecol_lote"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "=1.1.2", features = ["event-cpi"] }
mpl-core = "0.12.1"
solana-instructions-sysvar = "3"
solana-sdk-ids = "3"

[dev-dependencies]
litesvm = { version = "0.10.0", features = ["precompiles"] }
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3"
solana-transaction-error = "3"
solana-ed25519-program = "3"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
